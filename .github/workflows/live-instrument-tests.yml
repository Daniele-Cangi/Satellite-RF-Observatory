name: live-instrument offline tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # The frozen authority seals verify that earlier reviewed commits
          # remain ancestors of HEAD; a shallow checkout cannot answer that.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
          cache-dependency-path: requirements-live-instrument.txt

      - name: Install offline experiment dependencies
        run: python -m pip install -r requirements-live-instrument.txt

      - name: Run live-instrument suite without network probes
        run: python -m pytest experiments/live_instrument/tests -q
