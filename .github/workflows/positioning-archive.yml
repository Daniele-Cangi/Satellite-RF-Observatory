name: positioning web archive
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install pytest==8.4.2
      - run: python scripts/export_positioning_archive.py --check
      - run: python -m pytest scripts/tests/test_positioning_archive.py -q
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run build
        working-directory: web
