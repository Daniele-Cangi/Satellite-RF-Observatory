name: sealed Cassini type-1 PREDICT-SPK regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cassini-predict-spk-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up frozen Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"

      - name: Install exact regression dependencies
        run: python -m pip install pytest==8.4.2

      - name: Run non-optional real type-1 regression
        run: >-
          python -m pytest
          experiments/orbital_discriminability/sealed_ci/test_cassini_predict_spk.py
          -q
