plugins { id 'com.android.application' }

def revision = providers.gradleProperty('sourceRevision').getOrElse('UNSPECIFIED')
if (!(revision ==~ /[0-9a-f]{40}|UNSPECIFIED/)) {
    throw new GradleException('sourceRevision must be a full Git SHA or UNSPECIFIED')
}
android {
    namespace 'org.satelliterf.observatory.clock'
    compileSdk 36
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'org.satelliterf.observatory.clock'
        minSdk 29
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
        buildConfigField 'String', 'SOURCE_REVISION', '"' + revision + '"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'org.conscrypt:conscrypt-android:2.7.0'
    implementation 'org.cryptomator:siv-mode:1.6.1'
    implementation 'com.google.code.gson:gson:2.13.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.conscrypt:conscrypt-openjdk-uber:2.7.0'
}
// Desktop tests exercise the same public TLS API with its desktop JNI build.
configurations.matching { it.name.endsWith('UnitTestRuntimeClasspath') }.configureEach {
    exclude group: 'org.conscrypt', module: 'conscrypt-android'
}
tasks.withType(Test).configureEach {
    inputs.property('ntsLoopbackConfig', providers.environmentVariable('PNT_NTS_LOOPBACK_CONFIG').getOrElse('ABSENT'))
}
